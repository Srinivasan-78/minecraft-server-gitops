name: Deploy Config & Version

# Runs whenever config/ changes on main: pushes the edited files to the Azure
# VM, swaps the jar if MC_VERSION/MC_TYPE changed, and restarts.

on:
  push:
    branches: [main]
    paths:
      - config/**
      - scripts/**
  workflow_dispatch:
    inputs:
      action:
        description: What to do
        type: choice
        options: [sync-and-update, sync-config-only, update-jar-only, restart-only]
        default: sync-and-update

permissions:
  contents: read

concurrency:
  group: minecraft-vm
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: minecraft
    timeout-minutes: 30
    env:
      ACTION: ${{ inputs.action || 'sync-and-update' }}
      TARGET: ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - id: ssh
        uses: ./.github/actions/ssh-setup
        with:
          host: ${{ secrets.SSH_HOST }}
          user: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ vars.SSH_PORT || '22' }}
          known_hosts: ${{ secrets.SSH_KNOWN_HOSTS }}

      - name: Back up world before changing anything
        if: ${{ env.ACTION != 'restart-only' }}
        run: |
          ${{ steps.ssh.outputs.ssh }} "$TARGET" \
            "sudo ${{ steps.ssh.outputs.remote_dir }}/scripts/backup.sh"

      - name: Update jar
        if: ${{ env.ACTION == 'sync-and-update' || env.ACTION == 'update-jar-only' }}
        run: |
          ${{ steps.ssh.outputs.ssh }} "$TARGET" \
            "sudo MC_RESTART=false ${{ steps.ssh.outputs.remote_dir }}/scripts/update.sh"

      - name: Sync config
        if: ${{ env.ACTION == 'sync-and-update' || env.ACTION == 'sync-config-only' }}
        run: |
          ${{ steps.ssh.outputs.ssh }} "$TARGET" \
            "sudo MC_RESTART=false ${{ steps.ssh.outputs.remote_dir }}/scripts/sync-config.sh"

      - name: Restart service
        run: |
          ${{ steps.ssh.outputs.ssh }} "$TARGET" \
            "sudo systemctl restart minecraft && sleep 10"

      - name: Report status
        if: always()
        run: |
          ${{ steps.ssh.outputs.ssh }} "$TARGET" \
            "sudo ${{ steps.ssh.outputs.remote_dir }}/scripts/status.sh" \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Fail if the server did not come back up
        run: |
          ${{ steps.ssh.outputs.ssh }} "$TARGET" "systemctl is-active --quiet minecraft"
